# ============================================================================
# NO LONGER AUTO-RUN — the Cloud Build trigger was disabled at the CD cutover
# (2026-08-28). CD lives in .github/workflows/deploy.yml, which is the single
# source of truth for runtime config (env vars, secrets, scaling, probes).
# This file is kept as a provisioning / history reference only.
# ============================================================================
###############################################################################
# Cloud Build — dev environment (gub-review)
# Trigger: push to `main` branch
# Deploys a PUBLIC Cloud Run service (no IAP). Reviewer flows auth via URL
# token; the backend is the authorizer.
###############################################################################

substitutions:
  _REGION: us-central1
  _AR_REPO: gub-review
  _SERVICE: gub-review-dev
  _GUB_BACKEND_URL: https://gcp-universal-backend-dev-843516467880.us-central1.run.app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  # ── 1. Type check ─────────────────────────────────────────────────────────
  - id: typecheck
    name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - npm ci && npx tsc --noEmit

  # ── 2. Build Docker image ─────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE:latest
      - .
    waitFor: [typecheck]

  # ── 3. Push image ─────────────────────────────────────────────────────────
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE
    waitFor: [build]

  # ── 4. Deploy to Cloud Run ────────────────────────────────────────────────
  # PUBLIC — no IAP, --allow-unauthenticated. Reviewers access via email
  # magic link. Safety comes from unguessable URL tokens and backend auth.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=256Mi
      - --cpu=1
      - --port=8080
      - --set-env-vars=NODE_ENV=development,GCP_PROJECT_ID=$PROJECT_ID,GUB_BACKEND_URL=$_GUB_BACKEND_URL
    waitFor: [push]
