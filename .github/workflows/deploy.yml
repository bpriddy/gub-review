# Deploy — typecheck gate, build the image with the repo Dockerfile, push to
# Artifact Registry, roll the Cloud Run service.
#
# gub-review currently has a single environment (dev) — cloudbuild/ only
# ships dev.yaml — so there is no environment input yet. Add one (and new
# FLAGS case arms) when staging/prod exist.
#
# Auth is Workload Identity Federation (OIDC) — no service-account keys.
# Required GitHub repository variables: GCP_REGION, GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL.
# (No GH_PACKAGES_TOKEN — this repo has no private npm dependencies.)
#
# THIS WORKFLOW IS THE SINGLE SOURCE OF TRUTH FOR RUNTIME CONFIG (the FLAGS
# array below). cloudbuild/dev.yaml is a frozen provisioning/history
# reference (CD cutover 2026-08-28; this repo never had a Cloud Build
# trigger — deploys were manual).

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AR_REPO: gub-review
  SERVICE: gub-review-dev
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  # Mirrors the CI typecheck: a broken main must not deploy.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify target service is provisioned
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(metadata.name)' >/dev/null \
            || { echo "::error::Cloud Run service $SERVICE does not exist in $PROJECT_ID/$REGION. Provision it deliberately first."; exit 1; }

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE"
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE_URI=$IMAGE:$SHORT_SHA" >> "$GITHUB_ENV"

      # FLAGS = the ported cloudbuild/dev.yaml deploy args, verbatim.
      # DELIBERATELY no --service-account and no --set-secrets: the service
      # has always run as the project's default compute SA with no secrets;
      # omitting the flag preserves the current identity on update. Changing
      # that identity is a separate, deliberate task — not a CD side effect.
      - name: Deploy Cloud Run service
        run: |
          FLAGS=(
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --memory=256Mi
            --cpu=1
            --port=8080
            "--set-env-vars=NODE_ENV=development,GCP_PROJECT_ID=$PROJECT_ID,GUB_BACKEND_URL=https://gcp-universal-backend-dev-843516467880.us-central1.run.app"
          )
          gcloud run deploy "$SERVICE" --image "$IMAGE_URI" --region "$REGION" --platform managed "${FLAGS[@]}"

      - name: Report deployed revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestReadyRevisionName, status.url)'
