# Deploy — build the image with the repo Dockerfile, push to Artifact
# Registry, roll the Cloud Run service.
#
# gub-review currently has a single environment (dev) — cloudbuild/ only
# ships dev.yaml — so there is no environment input yet. Add one (and the
# matching cloudbuild config) when staging/prod exist.
#
# Auth is Workload Identity Federation (OIDC) — no service-account keys.
# Required GitHub repository variables: see CI-CD.md.
#
# This workflow updates the IMAGE ONLY. Env vars (NODE_ENV, GUB_BACKEND_URL),
# scaling and the public --allow-unauthenticated posture stay whatever the
# last cloudbuild/dev.yaml deploy set — that file remains the config source
# of truth, and first-time provisioning still goes through it.
#
# Manual trigger only for now: the existing Cloud Build trigger fires on push
# to main; enabling a push trigger here too would double-deploy. Once the
# Cloud Build trigger is disabled, uncomment `push:`.

name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AR_REPO: gub-review
  SERVICE: gub-review-dev
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # An image-only deploy must never CREATE the service.
      - name: Verify target service is provisioned
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(metadata.name)' >/dev/null \
            || { echo "::error::Cloud Run service $SERVICE does not exist in $PROJECT_ID/$REGION. Provision it first with cloudbuild/dev.yaml."; exit 1; }

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE"
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE_URI=$IMAGE:$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run service
        run: gcloud run deploy "$SERVICE" --image "$IMAGE_URI" --region "$REGION" --platform managed

      - name: Report deployed revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestReadyRevisionName, status.url)'
